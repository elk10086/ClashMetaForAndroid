name: Build Branded Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/freetime-phase1

jobs:
  build:
    name: Build ${{ matrix.display_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: Zy
            display_name: ZY
            output_dir: zyMeta
          - flavor: Fly
            display_name: Fastfly
            output_dir: flyMeta
          - flavor: Carx
            display_name: CarX
            output_dir: carxMeta

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: '1.26'

      - name: Apply Go patches
        shell: bash
        run: |
          cd "$(go env GOROOT)"
          for patch_file in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do
            patch --verbose -p 1 < "$patch_file"
          done

      - name: Update CA bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Configure release signing
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          {
            echo "keystore.password=$SIGNING_STORE_PASSWORD"
            echo "key.alias=$SIGNING_KEY_ALIAS"
            echo "key.password=$SIGNING_KEY_PASSWORD"
          } > signing.properties
          keytool -list -keystore release.keystore -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null

      - name: Build release APKs
        run: ./gradlew --no-daemon ":app:assemble${{ matrix.flavor }}MetaRelease"

      - name: Upload branded APKs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.display_name }}-Android-APK
          path: app/build/outputs/apk/${{ matrix.output_dir }}/release/*.apk
          if-no-files-found: error
